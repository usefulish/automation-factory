manifestVersion: 1
name: "@usefulish/audit-ledger"
version: "2026.09.23.1"
description: "Scheduled knowfleet audit-ledger pass — surveys the ledger, opens or adopts exactly one audit run, ensures it is worked without double-driving the cron polls, completes it, opens investigations for machine-revisable verdicts, and escalates to ntfy with a heartbeat."

repository: https://github.com/usefulish/automation-factory

paths:
  base: manifest

models:
  - audit_ledger.ts

reports:
  - audit_ledger_summary.ts

workflows:
  - workflow-audit-ledger.yaml

additionalFiles:
  - README.md

labels:
  - knowfleet
  - audit
  - ledger
  - investigation
  - fleet

# Host-specific by design: the pass reads kimchi's knowfleet ledger, the
# hermes profile cron state, and dispatches local agent profiles.
platforms: []
